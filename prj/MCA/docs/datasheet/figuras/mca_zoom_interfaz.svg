<svg xmlns="http://www.w3.org/2000/svg" width="448" height="216" viewBox="0 0 448 216" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<style>
  .bg{fill:#ffffff}            .box{fill:#ffffff;stroke:#1b1f24;stroke-width:1.6}
  .hdr{fill:#f2f4f7;stroke:none}
  .rule{stroke:#1b1f24;stroke-width:1.1}
  .sep{stroke:#c3cad1;stroke-width:0.9;stroke-dasharray:4 4}
  .pin{stroke:#1b1f24;stroke-width:1.3;fill:none}
  .arr{fill:#1b1f24;stroke:none}
  .nm{fill:#1b1f24}            .wd{fill:#57606a}
  .gp{fill:#0b6bcb;font-style:italic}
  .ti{fill:#1b1f24;font-weight:700} .sb{fill:#57606a} .pr{fill:#24292f}
  /* Tintes planos y no fill-opacity: hay renderers de SVG a PNG que ignoran la
     opacidad y dejan la elipse maciza, tapando los cables que abarca. */
  .brc{fill:none;stroke:#8c959f;stroke-width:1.2}
  .bus {fill:#eceff2;stroke:#aeb7c0;stroke-width:1.1}
  .busm{fill:#dcebfb;stroke:#0b6bcb;stroke-width:1.3}
  .buss{fill:#fbefd6;stroke:#bf8700;stroke-width:1.3}
  .dotm{fill:#0b6bcb;stroke:none}
  .dots{fill:#ffffff;stroke:#bf8700;stroke-width:1.6}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}          .box{fill:#0d1117;stroke:#c9d1d9}
    .hdr{fill:#161b22}         .rule{stroke:#c9d1d9}
    .sep{stroke:#30363d}       .pin{stroke:#c9d1d9}
    .arr{fill:#c9d1d9}         .nm{fill:#e6edf3} .wd{fill:#8b949e}
    .gp{fill:#58a6ff}          .ti{fill:#e6edf3} .sb{fill:#8b949e} .pr{fill:#c9d1d9}
    .brc{stroke:#6e7681}
    .bus {fill:#21262d;stroke:#6e7681}
    .busm{fill:#10243e;stroke:#58a6ff}
    .buss{fill:#2b2008;stroke:#d29922}
    .dotm{fill:#58a6ff}        .dots{fill:#0d1117;stroke:#d29922}
  }
</style>
