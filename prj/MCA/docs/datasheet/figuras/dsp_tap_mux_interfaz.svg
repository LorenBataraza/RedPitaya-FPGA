  .dotm{fill:#0b6bcb;stroke:none}
  .dots{fill:#ffffff;stroke:#bf8700;stroke-width:1.6}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}          .box{fill:#0d1117;stroke:#c9d1d9}
    .hdr{fill:#161b22}         .rule{stroke:#c9d1d9}
    .sep{stroke:#30363d}       .pin{stroke:#c9d1d9}
    .arr{fill:#c9d1d9}         .nm{fill:#e6edf3} .wd{fill:#8b949e}
    .gp{fill:#58a6ff}          .ti{fill:#e6edf3} .sb{fill:#8b949e} .pr{fill:#c9d1d9}
    .brc{stroke:#6e7681}
    .bus {fill:#21262d;stroke:#6e7681}
    .busm{fill:#10243e;stroke:#58a6ff}
    .buss{fill:#2b2008;stroke:#d29922}
    .dotm{fill:#58a6ff}        .dots{fill:#0d1117;stroke:#d29922}
  }
</style>
